# Maintained manually; directory globs automatically include new technology modules and nested SDK examples.
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
        - /
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
    - package-ecosystem: gomod
      directories:
        - /
        - /modulegen
        - /modules/*
        - /modules/**/examples
      groups:
        by-dependency:
          group-by: dependency-name
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
    - package-ecosystem: pip
      directories:
        - /docs-site
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
