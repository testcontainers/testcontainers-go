# Maintained manually; directory globs automatically include new modules and examples.
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
        - /
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
    - package-ecosystem: gomod
      directories:
        - /
        - /examples/*
        - /modulegen
        - /modules/*
        - /modules/redis/examples
      groups:
        by-dependency:
          group-by: dependency-name
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
    - package-ecosystem: pip
      directories:
        - /docs-site
      schedule:
        interval: monthly
        day: sunday
      open-pull-requests-limit: 3
      rebase-strategy: disabled
