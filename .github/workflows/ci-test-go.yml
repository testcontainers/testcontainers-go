name: Run tests for a Go project
run-name: "${{ inputs.project-directory }} ${{ inputs.go-version }} ${{ inputs.platforms }}"

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
        description: "The version of Go to use for the test."
      platforms:
        required: true
        type: string
        description: "The platforms in which the project will be run"
      project-directory:
        required: true
        type: string
        description: "The directory where the Go project is located."
      dependency-project-directory:
        required: false
        type: string
        default: ""
        description: "Dependency hook directory; defaults to the Go project directory."
      cache-dependency-path:
        required: false
        type: string
        default: ""
        description: "Optional multiline Go cache dependency paths."
      testcontainers-cloud:
        required: false
        type: boolean
        default: false
        description: "Run the tests on Testcontainers Cloud"
      rootless-docker:
        required: false
        type: boolean
        default: false
        description: "Run the test with rootless docker."
      ryuk-disabled:
        required: false
        type: boolean
        default: false
        description: "Disable the ryuk container for the test."
      runtime:
        required: false
        type: string
        default: docker
        description: "Docker-compatible runtime: docker, podman (core only), or sbx."
    secrets:
      DOCKERHUB_USERNAME:
        required: false
        description: "Docker Hub username accepted by sbx for the account."
      DOCKERHUB_TOKEN:
        required: false
        description: "Docker Hub access token accepted by sbx for the account."
      TCC_TOKEN:
        required: false
        description: "Optional Testcontainers Cloud token for existing Cloud jobs."
      SONAR_TOKEN:
        required: false
        description: "Optional Sonar token for existing main-branch analysis."

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  test-go-project:
    name: "test: ${{ inputs.project-directory }}/${{ inputs.go-version }} (${{ inputs.runtime }}, ${{ matrix.platform }})"
    # Modulegen can run the tests on all platforms
    env:
      TESTCONTAINERS_RYUK_DISABLED: "${{ inputs.ryuk-disabled }}"
      RYUK_CONNECTION_TIMEOUT: "${{ inputs.project-directory == 'modules/compose' && '5m' || '60s' }}"
      RYUK_RECONNECTION_TIMEOUT: "${{ inputs.project-directory == 'modules/compose' && '30s' || '10s' }}"
      SHOULD_RUN_SONAR: "false"
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ inputs.runtime == 'sbx' && 150 || 360 }}
    steps:
      - name: Verify sbx CI authentication configuration
        if: ${{ inputs.runtime == 'sbx' }}
        env:
          SBX_LOGIN_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          SBX_TRUSTED_EVENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [[ "$SBX_TRUSTED_EVENT" != true ]]; then
            echo '::error::sbx integration only accepts main pushes and same-repository pull requests.'
            exit 1
          fi
          if [[ "$SBX_LOGIN_CONFIGURED" != true ]]; then
            echo '::error::sbx integration requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN organization secrets, with an account allowed to use sbx under applicable organization policy.'
            exit 1
          fi

      - name: Select sbx CI namespace
        if: ${{ inputs.runtime == 'sbx' }}
        env:
          GO_VERSION_INPUT: ${{ inputs.go-version }}
        run: |
          namespace_hash=$(printf '%s' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GO_VERSION_INPUT" | sha256sum)
          echo "TESTCONTAINERS_SBX_APP_NAME=tc-sbx-${namespace_hash:0:12}" >> "$GITHUB_ENV"

      - name: Setup rootless Docker
        if: ${{ inputs.rootless-docker }}
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          rootless: true

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
            go-version: '${{ inputs.go-version }}'
            cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/go.sum', inputs.project-directory) }}
        id: go

      - name: Set up native rootful Podman
        if: ${{ inputs.runtime == 'podman' }}
        run: ./.github/scripts/setup-podman.sh

      - name: ensure compilation
        working-directory: ./${{ inputs.project-directory }}
        run: go build ./...

      - name: Install dependencies
        id: install-dependencies
        shell: bash
        env:
          DEPENDENCY_PROJECT_DIRECTORY: ${{ inputs.dependency-project-directory || inputs.project-directory }}
          TESTCONTAINERS_CI_RUNTIME: ${{ inputs.runtime }}
        run: |
          SCRIPT_PATH="./.github/scripts/$DEPENDENCY_PROJECT_DIRECTORY/install-dependencies.sh"
          if [ -f "$SCRIPT_PATH" ]; then
            "$SCRIPT_PATH"
          else
            echo "No dependencies script found at $SCRIPT_PATH - skipping installation"
          fi

      - name: Sign in to Docker for sbx
        id: sbx-login
        if: ${{ inputs.runtime == 'sbx' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          username=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')
          token=$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')
          if [[ -z "$username" || -z "$token" ]]; then
            echo '::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN organization secrets must be nonempty after trimming whitespace.'
            exit 1
          fi
          printf '%s\n' "$token" | sbx --app-name "$TESTCONTAINERS_SBX_APP_NAME" login --username "$username" --password-stdin

      # Setup Testcontainers Cloud Client right before your Testcontainers tests
      - name: Setup Testcontainers Cloud Client
        if: ${{ inputs.testcontainers-cloud }}
        uses: atomicjar/testcontainers-cloud-setup-action@7d1bab3fdfe0027c91936deca6b924d8a8a7a04d # v1.3
        with:
          token: ${{ secrets.TCC_TOKEN }}

      - name: go test
        if: ${{ inputs.runtime == 'docker' }}
        working-directory: ./${{ inputs.project-directory }}
        timeout-minutes: 30
        run: make test-unit

      - name: Test core with Podman and its compatibility path
        if: ${{ inputs.runtime == 'podman' }}
        timeout-minutes: 40
        run: ./.github/scripts/test-core-podman.sh

      - name: Test core, sbx module, and native Compose with sbx
        id: sbx-tests
        if: ${{ inputs.runtime == 'sbx' }}
        timeout-minutes: 120
        run: ./scripts/test-sbx.sh all

      - name: sbx diagnostics
        if: ${{ failure() && inputs.runtime == 'sbx' && steps.sbx-tests.outcome == 'failure' && steps.sbx-login.outcome == 'success' }}
        run: |
          if command -v sbx >/dev/null 2>&1; then
            sbx --app-name "$TESTCONTAINERS_SBX_APP_NAME" version || true
          fi

      - name: Sign out of the sbx CI namespace
        # Cleanup failures fail otherwise successful runs without hiding earlier errors.
        continue-on-error: ${{ steps.sbx-login.outcome != 'success' || steps.sbx-tests.outcome != 'success' }}
        if: ${{ always() && inputs.runtime == 'sbx' && steps.install-dependencies.outcome == 'success' && steps.sbx-login.outcome != 'skipped' && env.TESTCONTAINERS_SBX_APP_NAME != '' }}
        run: |
          if command -v sbx >/dev/null 2>&1; then
            sbx --app-name "$TESTCONTAINERS_SBX_APP_NAME" logout --force
          fi

      - name: Podman diagnostics
        if: ${{ failure() && inputs.runtime == 'podman' }}
        run: |
          sudo systemctl status podman.service podman.socket --no-pager || true
          namei -l /run/podman/podman.sock || true
          sudo podman info || true
          sudo podman ps -a || true
          sudo podman network ls || true
          sudo podman volume ls || true
          sudo journalctl -u podman.service --no-pager -n 200 || true

      - name: Run checker
        # Modulegen tests templates without starting containers, including on macOS.
        if: ${{ inputs.project-directory != 'modulegen' && inputs.runtime != 'sbx' }}
        run: |
            ./scripts/check_environment.sh

      # (Optionally) When you don't need Testcontainers Cloud anymore, you could terminate sessions eagerly
      - name: Terminate Testcontainers Cloud Client active sessions
        if: ${{ inputs.testcontainers-cloud }}
        uses: atomicjar/testcontainers-cloud-setup-action@7d1bab3fdfe0027c91936deca6b924d8a8a7a04d # v1.3
        with:
          action: terminate

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
            paths: ${{ inputs.runtime == 'sbx' && '**/TEST-unit*.xml' || format('**/{0}/TEST-unit*.xml', inputs.project-directory) }}
        if: always()

      - name: Upload sbx test reports
        if: ${{ always() && inputs.runtime == 'sbx' && steps.sbx-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ inputs.runtime }}-${{ inputs.go-version }}-${{ matrix.platform }}
          path: '**/TEST-unit*.xml'
          if-no-files-found: warn

      - name: Decide if Sonar must be run
        if: ${{ matrix.platform == 'ubuntu-latest' && inputs.runtime == 'docker' }}
        run: |
          if [[ "1.26.x" == "${{ inputs.go-version }}" ]] && \
             [[ "true" != "${{ inputs.rootless-docker }}" ]] && \
             [[ "true" != "${{ inputs.testcontainers-cloud }}" ]] && \
             [[ "true" != "${{ inputs.ryuk-disabled }}" ]] && \
             [[ "main" == "${{ github.ref_name }}" ]] && \
             [[ "testcontainers" == "${{ github.repository_owner }}" ]]; then
            echo "SHOULD_RUN_SONAR=true" >> $GITHUB_ENV
          fi

      - name: Set Sonar Cloud environment variables
        if: ${{ env.SHOULD_RUN_SONAR == 'true' }}
        run: |
          echo "PROJECT_VERSION=$(grep 'latest_version' mkdocs.yml | cut -d':' -f2 | tr -d ' ')" >> $GITHUB_ENV
          if [ "${{ inputs.project-directory }}" == "" ]; then
            echo "PROJECT_KEY=testcontainers_testcontainers-go" >> $GITHUB_ENV
            echo "PROJECT_NAME=testcontainers-go" >> $GITHUB_ENV
            echo "PROJECT_SRC_EXCLUSIONS=**/*_test.go,**/vendor/**,**/testdata/**,modules/**,examples/**,modulegen/**" >> $GITHUB_ENV
            echo "PROJECT_TEST_EXCLUSIONS=**/vendor/**,modules/**,examples/**,modulegen/**" >> $GITHUB_ENV
          else
            echo "PROJECT_KEY=testcontainers_testcontainers-go_$(echo ${{ inputs.project-directory }} | tr '/' '_')" >> $GITHUB_ENV
            echo "PROJECT_NAME=testcontainers-go-$(echo ${{ inputs.project-directory }} | tr '/' '-')" >> $GITHUB_ENV
            echo "PROJECT_SRC_EXCLUSIONS=**/*_test.go,**/vendor/**,**/testdata/**" >> $GITHUB_ENV
            echo "PROJECT_TEST_EXCLUSIONS=**/vendor/**" >> $GITHUB_ENV
          fi

      - name: SonarQube Scan
        if: ${{ env.SHOULD_RUN_SONAR == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: "${{ inputs.project-directory == '' && '.' || inputs.project-directory }}"
          args: >
            -Dsonar.organization=testcontainers
            -Dsonar.projectKey=${{ env.PROJECT_KEY }}
            -Dsonar.projectName=${{ env.PROJECT_NAME }}
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
            -Dsonar.project.monorepo.enabled=true
            -Dsonar.branch.name=main
            -Dsonar.sources=.
            -Dsonar.exclusions=${{ env.PROJECT_SRC_EXCLUSIONS }}
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.test.exclusions=${{ env.PROJECT_TEST_EXCLUSIONS }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=TEST-unit.xml
