name: Test sbx integration

on:
  workflow_call:
    secrets:
      DOCKERPUBLICBOT_WRITE_PAT:
        description: Docker Hub access token accepted by sbx for the account
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sbx:
    name: "sbx integration / ubuntu-24.04 / Go 1.26.x"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TESTCONTAINERS_SBX_APP_NAME: tc-go-sbx-ci
    steps:
      - name: Verify sbx CI authentication configuration
        env:
          SBX_LOGIN_CONFIGURED: ${{ vars.DOCKERPUBLICBOT_USERNAME != '' && secrets.DOCKERPUBLICBOT_WRITE_PAT != '' }}
          SBX_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "$SBX_FORK_PULL_REQUEST" == true ]]; then
            echo '::error::sbx integration requires Docker Hub credentials unavailable to fork pull requests. A maintainer must review and trust the code, then run it from a trusted upstream ref.'
            exit 1
          fi
          if [[ "$SBX_LOGIN_CONFIGURED" != true ]]; then
            echo '::error::sbx integration requires the DOCKERPUBLICBOT_USERNAME repository variable and DOCKERPUBLICBOT_WRITE_PAT secret, with an account allowed to use sbx under applicable organization policy.'
            exit 1
          fi
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            modules/sbx/go.sum
            modules/compose/go.sum
      - name: Install sbx and verify VM prerequisites
        id: install-sbx
        run: ./.github/scripts/setup-sbx.sh
      - name: Sign in to Docker for sbx
        env:
          DOCKERPUBLICBOT_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
          DOCKERPUBLICBOT_WRITE_PAT: ${{ secrets.DOCKERPUBLICBOT_WRITE_PAT }}
        run: |
          username=$(printf '%s' "$DOCKERPUBLICBOT_USERNAME" | tr -d '[:space:]')
          token=$(printf '%s' "$DOCKERPUBLICBOT_WRITE_PAT" | tr -d '[:space:]')
          if [[ -z "$username" || -z "$token" ]]; then
            echo '::error::DOCKERPUBLICBOT_USERNAME and DOCKERPUBLICBOT_WRITE_PAT must be nonempty after trimming whitespace.'
            exit 1
          fi
          printf '%s\n' "$token" | sbx --app-name "$TESTCONTAINERS_SBX_APP_NAME" login --username "$username" --password-stdin
      - name: Run sbx module, core, and Compose integration
        run: ./scripts/test-sbx.sh all
      - name: Sign out of the sbx CI namespace
        if: ${{ always() && steps.install-sbx.outcome == 'success' }}
        run: sbx --app-name "$TESTCONTAINERS_SBX_APP_NAME" logout --force
