name: Main pipeline

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modified-modules.outputs.modules }}
      modules_count: ${{ steps.set-modified-modules-count.outputs.modules_count }}
      sbx_changed: ${{ contains(fromJSON(steps.set-modified-modules.outputs.modules), '') || steps.changed-files.outputs.sbx_all_changed_and_modified_files_count > 0 }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changed-files
        name: Get changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # Classify both sides of renames, including paths moved out of sbx.
          output_renamed_files_as_deleted_and_added: true
          files_yaml: |
            all:
              - '**'
            sbx:
              - 'modules/sbx/**'
              - 'modules/compose/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-test-go.yml'
              - '.github/scripts/**'
              - 'scripts/test-sbx.sh'

      - id: set-modified-modules
        name: Set all modified modules
        env:
          # Include deletions and both sides of renames across modules.
          ALL_CHANGED_FILES: "${{ steps.changed-files.outputs.all_all_changed_and_modified_files }}"
        run: echo "modules=$(./scripts/changed-modules.sh)" >> "$GITHUB_OUTPUT"

      - name: Test module detection
        run: ./scripts/changed-modules_test.sh

      - id: set-modified-modules-count
        name: Set all modified modules count
        run: echo "modules_count=$(echo ${{ toJSON(steps.set-modified-modules.outputs.modules) }} | jq '. | length')" >> "$GITHUB_OUTPUT"

      - name: Print out the modules to be used
        run: |
          echo "${{ steps.set-modified-modules-count.outputs.modules_count }} modules in the build"
          echo "${{ steps.set-modified-modules.outputs.modules }}"

  lint:
    # only run if there are modules to lint
    if: ${{ needs.detect-modules.outputs.modules_count > 0  }}
    needs:
      - detect-modules
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    uses: ./.github/workflows/ci-lint-go.yml
    with:
      project-directory: "${{ matrix.module }}"

  test:
    # only run if there are modules to test
    if: ${{ needs.detect-modules.outputs.modules_count > 0  }}
    needs:
      - detect-modules
      - lint
    strategy:
      # We don't want to fail the build the soonest but identify which modules passed and failed.
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
        exclude:
          # The Quay MinIO image requires credentials not available in CI.
          - module: modules/minio
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for sonarsource/sonarcloud-github-action to determine which PR to decorate
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: ${{ matrix.module == 'modulegen' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]' }}
      project-directory: "${{ matrix.module }}"
      testcontainers-cloud: false
      rootless-docker: false
      ryuk-disabled: false
    secrets: inherit

  test-core-podman:
    # A Podman-only change must test core without selecting every Docker module.
    if: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), '') || contains(fromJSON(needs.detect-modules.outputs.modules), 'modules/podman') }}
    needs:
      - detect-modules
      - lint
    name: Test core using Podman
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: '["ubuntu-24.04"]'
      project-directory: "."
      runtime: podman

  test-sbx:
    if: ${{ needs.detect-modules.outputs.sbx_changed == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: detect-modules
    name: Test core using sbx
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: '["ubuntu-24.04"]'
      project-directory: "."
      runtime: sbx
      dependency-project-directory: modules/sbx
      cache-dependency-path: |
        go.sum
        modules/sbx/go.sum
        modules/compose/go.sum
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The job below is a copy of the job above, but using Docker Cloud.
  test-testcontainers-cloud:
    # the core module is identified by the empty string (the root path)
    if: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), '') }}
    needs:
      - detect-modules
      - lint
    name: "Test using Testcontainers Cloud"
    strategy:
      # We don't want to fail the build the soonest but identify which modules passed and failed.
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: '["ubuntu-latest"]'
      project-directory: "."
      testcontainers-cloud: true
      rootless-docker: false
      ryuk-disabled: false

  # The job below is a copy of the job above, but with ryuk disabled.
  # It's executed in the first stage to avoid concurrency issues.
  test-reaper-off:
    # the core module is identified by the empty string (the root path)
    if: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), '') }}
    needs:
      - detect-modules
      - lint
    name: "Test with reaper off"
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: '["ubuntu-latest"]'
      project-directory: "."
      testcontainers-cloud: false
      rootless-docker: false
      ryuk-disabled: true

  # The job below is a copy of the job above, but with Docker rootless.
  # It's executed in the first stage to avoid concurrency issues.
  test-rootless-docker:
    # the core module is identified by the empty string (the root path)
    if: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), '') }}
    needs:
      - detect-modules
      - lint
    name: "Test with Rootless Docker"
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
    uses: ./.github/workflows/ci-test-go.yml
    with:
      go-version: ${{ matrix.go-version }}
      platforms: '["ubuntu-latest"]'
      project-directory: "."
      testcontainers-cloud: false
      rootless-docker: true
      ryuk-disabled: false

  # This job serves as confirmation that all test jobs finished
  end:
    if: ${{ always() }}
    needs:
      - detect-modules
      - lint
      - test
      - test-core-podman
      - test-sbx
      - test-testcontainers-cloud
      - test-reaper-off
      - test-rootless-docker
    runs-on: ubuntu-latest
    steps:
      - name: Check all expected jobs completed successfully
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          MODULES: ${{ needs.detect-modules.outputs.modules }}
          SBX_REQUIRED: ${{ needs.detect-modules.outputs.sbx_changed == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$JOB_RESULTS"
          jq -e 'type == "array" and all(.[]; type == "string")' <<< "$MODULES"
          required=(detect-modules)
          if jq -e 'length > 0' <<< "$MODULES" > /dev/null; then
            required+=(lint)
          fi
          if jq -e 'any(.[]; . != "modules/minio")' <<< "$MODULES" > /dev/null; then
            required+=(test)
          fi
          if jq -e 'index("") != null' <<< "$MODULES" > /dev/null; then
            required+=(test-testcontainers-cloud test-reaper-off test-rootless-docker)
          fi
          if jq -e 'index("") != null or index("modules/podman") != null' <<< "$MODULES" > /dev/null; then
            required+=(test-core-podman)
          fi
          if [[ "$SBX_REQUIRED" == "true" ]]; then
            required+=(test-sbx)
          fi
          for job in "${required[@]}"; do
            jq -e --arg job "$job" '.[$job].result == "success"' <<< "$JOB_RESULTS"
          done
          echo "All expected jobs completed successfully!"
